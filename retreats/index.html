    <!--
      Second Vite entry, built to dist/retreats/index.html so the host serves it
      for /retreats. It exists for one reason: link previews. WhatsApp, Facebook
      and mail clients read these tags without running JavaScript, so the SPA's
      usePageMeta can't reach them, and every shared /retreats link would show
      the consulting card from the root index.html. Same app, same main.tsx.
    -->
    <title>The Season Residency: a marketer for your retreat centre | Rihards Zeila</title>
    <meta name="description" content="A senior marketer living at your centre for a season, working on bookings, ads, website and automations in exchange for a room and the practice." />

    <link rel="canonical" href="https://rihardszeila.com/retreats" />

    <meta property="og:type" content="website" />
